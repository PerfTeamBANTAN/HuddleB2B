<div id="dashboard-b2c-wrapper" class="dashboard-dark container-fluid px-3 px-lg-4 pb-4">

  <!-- ================= HEADER ================= -->
  <div class="dashboard-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <h4 class="fw-bold mb-0">DASHBOARD B2C DISTRICT BANTEN</h4>
      <div class="last-update small text-muted" id="b2cLastUpdate">
        Loading...
      </div>
    </div>
  </div>

  <!-- ================= SUMMARY KPI ================= -->
  <div class="row g-3 mb-4" id="b2cSummary">

    <div class="col-12">
      <div class="panel-card">
        <div class="panel-body text-center py-4">

          <!-- loading state -->
          <div class="summary-loading loading-card">
            <div class="spinner-border text-info mb-2"></div>
            <div class="small text-muted">Loading summary data...</div>
          </div>

          <!-- summary KPI inject here -->
        </div>
      </div>
    </div>

  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="row g-3">

    <!-- ========== LEFT : KPI GRID ========== -->
    <div class="col-lg-8 col-xl-8">

      <div class="panel-card h-100">

        <div class="panel-header">
          <span>KPI PERFORMANCE</span>
        </div>

        <div class="panel-body">

          <!-- KPI LOADING -->
          <div id="b2cKpiLoading" class="kpi-loading loading-card text-center py-5">
            <div class="spinner-border text-info mb-2"></div>
            <div class="small text-muted">Loading KPI data...</div>
          </div>

          <!-- KPI GRID -->
          <div id="b2cKpiGrid" class="kpi-grid d-none">
            <!-- JS inject KPI cards -->
          </div>

        </div>
      </div>

    </div>

    <!-- ========== RIGHT : TABLES ========== -->
    <div class="col-lg-4 col-xl-4">

      <!-- ================= TANGERANG ================= -->
      <div class="panel-card mb-4">

        <div class="panel-header">
          <span class="text-warning">KPI NOT ACH - TANGERANG</span>
          <span class="badge bg-danger">Not Ach</span>
        </div>

        <div class="panel-body p-0">

          <!-- LOADING -->
          <div id="b2cTableLoadingTgr" class="table-loading text-center py-4">
            <div class="spinner-border spinner-border-sm text-warning mb-2"></div>
            <div class="small text-muted">Loading table...</div>
          </div>

          <!-- TABLE -->
          <div class="table-responsive d-none" id="b2cTableWrapperTgr">
            <table class="table table-dark table-sm align-middle kpi-table mb-0">
              <thead>
                <tr>
                  <th>Indikator</th>
                  <th>Target</th>
                  <th>Ach HI</th>
                  <th>Status</th>
                  <th>Ach Kemarin</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="b2cKpiTableTgr">
                <!-- JS inject -->
              </tbody>
            </table>
          </div>

        </div>
      </div>

      <!-- ================= BANTEN ================= -->
      <div class="panel-card">

        <div class="panel-header">
          <span class="text-info">KPI NOT ACH - BANTEN</span>
          <span class="badge bg-danger">Not Ach</span>
        </div>

        <div class="panel-body p-0">

          <!-- LOADING -->
          <div id="b2cTableLoadingBtn" class="table-loading text-center py-4">
            <div class="spinner-border spinner-border-sm text-info mb-2"></div>
            <div class="small text-muted">Loading table...</div>
          </div>

          <!-- TABLE -->
          <div class="table-responsive d-none" id="b2cTableWrapperBtn">
            <table class="table table-dark table-sm align-middle kpi-table mb-0">
              <thead>
                <tr>
                  <th>Indikator</th>
                  <th>Target</th>
                  <th>Ach HI</th>
                  <th>Status</th>
                  <th>Ach Kemarin</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="b2cKpiTableBtn">
                <!-- JS inject -->
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>

  </div>

</div>
