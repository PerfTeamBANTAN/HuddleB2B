<div class="dashboard-dark container-fluid px-3 px-lg-4">

  <!-- ================= HEADER ================= -->
  <div class="dashboard-header mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <h4 class="fw-bold mb-0">DASHBOARD B2C DISTRICT BANTEN</h4>
      <div class="last-update small text-muted" id="b2cLastUpdate">
        Loading...
      </div>
    </div>
  </div>

  <!-- ================= SUMMARY ================= -->
  <div class="dashboard-summary mb-4">
    <div class="row g-3" id="b2cSummary">

      <div class="col-12">
        <div class="summary-loading loading-card text-center py-4">
          <div class="spinner-border text-info mb-2"></div>
          <div class="small text-muted">Loading summary data...</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="dashboard-content">
    <div class="row g-3">

      <!-- ========== LEFT : KPI SECTION ========== -->
      <div class="col-lg-8 col-xl-8">
        <div class="kpi-section">

          <!-- KPI LOADING -->
          <div id="b2cKpiLoading" class="kpi-loading loading-card text-center py-5">
            <div class="spinner-border text-info mb-2"></div>
            <div class="small text-muted">Loading KPI data...</div>
          </div>

          <!-- KPI GRID -->
          <div id="b2cKpiGrid" class="kpi-grid d-none">
            <!-- JS inject KPI cards -->
          </div>

        </div>
      </div>

      <!-- ========== RIGHT : TABLE SECTION ========== -->
      <div class="col-lg-4 col-xl-4">
        <div class="table-section" id="b2cTablePanel">

          <!-- ================= TANGERANG ================= -->
          <div class="table-group table-tangerang mb-4">

            <div class="table-header d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold text-warning mb-0">KPI NOT ACH - TANGERANG</h6>
              <span class="badge bg-danger">Not Ach</span>
            </div>

            <div class="table-body">

              <!-- LOADING -->
              <div id="b2cTableLoadingTgr" class="table-loading text-center py-4">
                <div class="spinner-border spinner-border-sm text-warning mb-2"></div>
                <div class="small text-muted">Loading table...</div>
              </div>

              <!-- TABLE -->
              <div class="table-responsive d-none" id="b2cTableWrapperTgr">
                <table class="table table-dark table-sm align-middle kpi-table">
                  <thead>
                    <tr>
                      <th>Indikator</th>
                      <th>Target</th>
                      <th>Ach HI</th>
                      <th>Status</th>
                      <th>Ach Kemarin</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="b2cKpiTableTgr">
                    <!-- JS inject -->
                  </tbody>
                </table>
              </div>

            </div>
          </div>

          <!-- ================= BANTEN ================= -->
          <div class="table-group table-banten">

            <div class="table-header d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold text-info mb-0">KPI NOT ACH - BANTEN</h6>
              <span class="badge bg-danger">Not Ach</span>
            </div>

            <div class="table-body">

              <!-- LOADING -->
              <div id="b2cTableLoadingBtn" class="table-loading text-center py-4">
                <div class="spinner-border spinner-border-sm text-info mb-2"></div>
                <div class="small text-muted">Loading table...</div>
              </div>

              <!-- TABLE -->
              <div class="table-responsive d-none" id="b2cTableWrapperBtn">
                <table class="table table-dark table-sm align-middle kpi-table">
                  <thead>
                    <tr>
                      <th>Indikator</th>
                      <th>Target</th>
                      <th>Ach HI</th>
                      <th>Status</th>
                      <th>Ach Kemarin</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="b2cKpiTableBtn">
                    <!-- JS inject -->
                  </tbody>
                </table>
              </div>

            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>
