<div id="alert-wrapper" class="district-wrapper px-3">

  <!-- ================= TITLE ================= -->
  <h4 class="text-center text-light mb-3">
    Performance Alert HSI & SQM – B2B District Banten
  </h4>

  <!-- ================= CARD KPI ================= -->
  <div id="alert-row" class="cards-scroll mb-3"></div>

  <!-- ================= TAB HSI / SQM ================= -->
  <div class="mb-3 d-flex flex-wrap gap-2" id="alert-tabs">
    <button
      class="btn btn-sm btn-primary active"
      data-type="alert_hsi_table">
      <i class="fa fa-bell me-1"></i> Alert HSI
    </button>

    <button
      class="btn btn-sm btn-outline-light"
      data-type="alert_sqm_table">
      <i class="fa fa-bell me-1"></i> Alert SQM
    </button>
  </div>

  <!-- ================= FILTER ================= -->
  <div class="row g-2 mb-4">
    <div class="col-md-3">
      <select
        id="alert-filter-witel"
        class="form-select form-select-sm">
        <option value="">All Witel</option>
      </select>
    </div>

    <div class="col-md-3">
      <select
        id="alert-filter-sto"
        class="form-select form-select-sm">
        <option value="">All STO</option>
      </select>
    </div>
  </div>

  <!-- ================= LOADING OVERLAY ================= -->
  <div id="alert-loading-overlay" class="loading-overlay d-none">
    <div class="spinner-border text-light mb-2"></div>
    <div class="loading-text">Mengambil data...</div>
  </div>

  <!-- ================= TABLE ================= -->
  <div class="mt-3">
    <h5 class="text-light mb-2">Detail Alert HSI & SQM</h5>

    <div class="table-responsive">
      <table class="table table-dark table-striped table-bordered table-sm align-middle">
        <thead class="table-secondary text-dark">
          <tr id="alert-table-head"></tr>
        </thead>
        <tbody id="alert-table-body">
          <tr>
            <td class="text-center text-muted">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ================= LAST UPDATE ================= -->
  <div
    id="alert-last-update"
    class="last-update text-end px-2 pb-3 mt-2">
    <i class="fa fa-clock me-1"></i> Last update: -
  </div>

</div>
