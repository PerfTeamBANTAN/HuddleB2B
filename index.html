<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PERFORMANCE BAN-TAN - Dashboard Integrated</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ================= NAVBAR ================= */
    .navbar {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 22px;
      color: #fff;
    }

    .nav-link {
      color: #fff !important;
      border-radius: 6px;
      padding: 8px 14px;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.15);
    }

    .dropdown-menu {
      background: rgba(0,0,0,0.9);
      border: none;
    }

    .dropdown-item {
      color: #fff;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* ================= HOME ================= */
    .home-fullscreen {
      height: 100vh;
      margin-top: 56px;
      background: url('huddle_performance.png') center / cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30px;
      transition: 0.3s;
    }

    .home-fullscreen.no-bg {
      background: #000;
    }

    #content-area {
      width: 100%;
      color: #fff;
    }

    /* ================= DISTRICT ================= */
    .district-wrapper {
      max-width: 1400px;
      margin: auto;
    }

    /* ================= KPI CARDS ================= */
    .cards-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      padding: 10px;
    }

    .badge-card {
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      height: 140px;
      font-size: 13px;
    }

    .badge-card-header {
      background: linear-gradient(135deg, #6f72ff, #8f94fb);
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 6px;
      font-size: 13px;
    }

    .badge-card-body {
      padding: 10px 12px;
    }

    .card-danger {
      background: #f8d7da;
    }

    .card-success {
      background: #d4edda;
    }

    .card-warning {
      background: #fff3cd;
    }

    .row-item {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .target { color: #000; }
    .banten { color: #0047ab; }
    .tangerang { color: #b30000; }

    /* ================= SCROLL ================= */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #666;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#" onclick="location.reload()">
      <img src="PERFORMANCE TEAM.png" height="36" class="me-2">
      PERFORMANCE BAN-TAN
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Huddle Performance</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item menu-link" data-menu="q-hsi">Q HSI</a></li>
            <li><a class="dropdown-item menu-link" data-menu="q-datin">Q DATIN</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
            Huddle Performance Khusus B2B
          </a>
          <ul class="dropdown-menu">
            <li class="dropdown dropend">
              <a class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown">
                Dashboard B2B District BANTEN
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item menu-link" data-menu="District-Banten">District BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-banten">B2B BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-tangerang">B2B TANGERANG</a></li>
              </ul>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item menu-link" data-menu="dashboard-b2b">Dashboard B2B</a></li>
          </ul>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- ================= CONTENT ================= -->
<div id="home-fullscreen" class="home-fullscreen">
  <div id="content-area"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const B2B_API_URL =
    'https://script.google.com/macros/s/AKfycby8iFZkMY53F4pYQFuH00b6Av7NAwp5Rtrk3b1GfNd6hwJelmlSjcUGeZjXlnz_Zmr2/exec';

  function showUnderConstruction() {
    const home = document.getElementById('home-fullscreen');
    const content = document.getElementById('content-area');
    home.classList.add('no-bg');

    content.innerHTML = `
      <div class="text-center mt-5">
        <div class="spinner-border text-light mb-3"></div>
        <div>Under Construction</div>
      </div>
    `;
  }

  async function loadPartialIntoContent(url, onLoaded) {
    const home = document.getElementById('home-fullscreen');
    const content = document.getElementById('content-area');
    home.classList.add('no-bg');

    content.innerHTML = `
      <div class="text-center mt-5">
        <div class="spinner-border text-light mb-3"></div>
        <div>Loading...</div>
      </div>
    `;

    const res = await fetch(url);
    content.innerHTML = await res.text();
    if (onLoaded) onLoaded();
  }

  document.querySelectorAll('.menu-link').forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      const menu = el.dataset.menu;

      if (menu === 'District-Banten') {
        loadPartialIntoContent('partials/district-banten.html', () => {
          const s = document.createElement('script');
          s.src = 'js/district-banten.js';
          s.onload = () => initDistrictBanten(B2B_API_URL);
          document.body.appendChild(s);
        });
      } else {
        showUnderConstruction();
      }
    };
  });
</script>

</body>
</html>
