  <style>
    :root {
      --primary-blue: #004085;
      --accent-blue: #007bff;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000; /* fallback kalau gambar belum load */
      overflow: hidden;       /* tidak ada scroll */
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6) !important;
      box-shadow: none;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 24px;
      color: #fff;
    }

    .navbar-nav .nav-link {
      color: #fff !important;
      transition: 0.3s;
      padding: 8px 15px;
      border-radius: 6px;
    }

    .navbar-nav .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff !important;
    }

    .dropdown-menu {
      background-color: rgba(0, 0, 0, 0.85);
      border: none;
    }

    .dropdown-item {
      color: #fff;
    }

    .dropdown-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* PERBAIKAN: class ini yang dipakai untuk background fullscreen */
    .home-fullscreen {
      width: 100%;
      height: 100vh; /* wajib, supaya div punya tinggi penuh layar */
      background: url('huddle_performance.png') center center / cover no-repeat;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 56px; /* offset tinggi navbar (standard Bootstrap) */
    }

    .home-overlay {
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
