<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERFORMANCE BAN-TAN - Dashboard Integrated</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
}

.navbar-brand {
  font-weight: 700;
  font-size: 22px;
  color: #fff;
}

.navbar-nav .nav-link {
  color: #fff !important;
  padding: 8px 14px;
  border-radius: 6px;
}

.navbar-nav .nav-link:hover {
  background: rgba(255,255,255,0.15);
}

/* DROPDOWN */
.dropdown-menu {
  background: rgba(0,0,0,0.95);
  border: none;
}

.dropdown-item {
  color: #fff;
  font-size: 14px;
}

.dropdown-item:hover {
  background: rgba(255,255,255,0.1);
}

/* HOME */
.home-fullscreen {
  width: 100%;
  min-height: 100vh;
  margin-top: 56px;
  background: url('huddle_performance.png') center / cover no-repeat;
}

.no-bg {
  background: #000 !important;
}

/* CONTENT */
#content-area {
  width: 100%;
  min-height: calc(100vh - 56px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

#content-area.show-grid {
  display: block !important;
}

/* GRID */
.cards-scroll {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  padding: 16px;
}

/* CARD */
.badge-card {
  border-radius: 10px;
  overflow: hidden;
  height: 140px;
  background: #d1e7dd;
  box-shadow: 0 6px 14px rgba(0,0,0,0.6);
  font-size: 13px;
}

.badge-card-header {
  background: linear-gradient(135deg,#6f72ff,#8f94fb);
  color: #fff;
  font-weight: 700;
  text-align: center;
  padding: 8px;
}

.badge-card-body {
  padding: 10px 12px;
}

.row-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-weight: 600;
}

.card-good { background: #d1e7dd !important; }
.card-bad { background: #f8d7da !important; }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
<a class="navbar-brand" href="javascript:void(0)" onclick="location.reload()">
<img src="PERFORMANCE TEAM.png" style="height:40px;margin-right:10px;">
PERFORMANCE BAN-TAN
</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav">

<li class="nav-item dropdown">
<a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
Huddle Performance
</a>
<ul class="dropdown-menu">
<li><a class="dropdown-item menu-link" data-menu="q-hsi">Q HSI</a></li>
<li><a class="dropdown-item menu-link" data-menu="q-datin">Q DATIN</a></li>
</ul>
</li>

<li class="nav-item dropdown">
<a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
Huddle Performance Khusus B2B
</a>

<ul class="dropdown-menu">
<li class="dropdown dropend">
<a class="dropdown-item dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
Dashboard B2B District BANTEN
</a>
<ul class="dropdown-menu">
<li><a class="dropdown-item menu-link" data-menu="District-Banten">Performance Q HSI</a></li>
<li><a class="dropdown-item menu-link" data-menu="Asgar-HSI">Performance Assurance Guarantee HSI</a></li>
<li><a class="dropdown-item menu-link" data-menu="TTR-HSI">Performance TTR HSI dan Datin</a></li>
</ul>
</li>
</ul>
</li>

</ul>
</div>
</div>
</nav>

<div class="home-fullscreen" id="home-fullscreen">
  <div id="content-area"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const B2B_API_URL =
'https://script.google.com/macros/s/AKfycby8iFZkMY53F4pYQFuH00b6Av7NAwp5Rtrk3b1GfNd6hwJelmlSjcUGeZjXlnz_Zmr2/exec';

function showLoading() {
  const home = document.getElementById('home-fullscreen');
  const content = document.getElementById('content-area');
  home.classList.add('no-bg');
  content.innerHTML = `
    <div class="text-center">
      <div class="spinner-border text-light mb-2"></div>
      <div>Loading dashboard...</div>
    </div>
  `;
}

async function loadPartial(url) {
  showLoading();
  const res = await fetch(url);
  document.getElementById('content-area').innerHTML = await res.text();
  document.getElementById('content-area').classList.add('show-grid');

  const s = document.createElement('script');
  s.src = 'js/district-banten.js?' + Date.now();
  s.onload = () => initDistrictBanten(B2B_API_URL);
  document.body.appendChild(s);
}

document.querySelectorAll('.menu-link').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    const menu = el.dataset.menu;

    if (
      menu === 'District-Banten' ||
      menu === 'Asgar-HSI' ||
      menu === 'TTR-HSI'
    ) {
      loadPartial('partials/district-banten.html');
    }
  });
});
</script>

</body>
</html>
