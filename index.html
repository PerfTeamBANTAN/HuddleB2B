<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Performance BAN-TAN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background:#000;
  color:#fff;
  font-family: Arial, Helvetica, sans-serif;
  margin:0;
}

.navbar {
  background:#000;
}

#content-area {
  width:100%;
  min-height:calc(100vh - 56px);
  padding:20px;
  overflow-y:auto;
}

/* GRID CARD */
.cards-scroll {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
  gap:18px;
}

/* CARD */
.kpi-card {
  background:#dff5e1;
  border-radius:8px;
  overflow:hidden;
  color:#000;
  box-shadow:0 4px 10px rgba(0,0,0,.5);
}

.kpi-title {
  background:#7c83ff;
  color:#fff;
  padding:6px;
  text-align:center;
  font-weight:bold;
  font-size:13px;
}

.kpi-body {
  padding:10px;
  font-size:13px;
}

.row-item {
  display:flex;
  justify-content:space-between;
  margin-bottom:4px;
}

.row-item.banten span:last-child { color:#0d6efd; font-weight:bold; }
.row-item.tangerang span:last-child { color:#dc3545; font-weight:bold; }

.under {
  display:flex;
  justify-content:center;
  align-items:center;
  height:80vh;
}

.under img {
  max-width:300px;
  opacity:.9;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">PERFORMANCE BAN-TAN</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            Huddle Performance Khusus B2B
          </a>

          <ul class="dropdown-menu">

            <li class="dropdown dropend">
              <a class="dropdown-item dropdown-toggle" href="#"
                 data-bs-toggle="dropdown" data-bs-auto-close="outside">
                Dashboard B2B District BANTEN
              </a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item menu-link" data-menu="district-banten">District BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-banten">B2B BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-tangerang">B2B TANGERANG</a></li>
              </ul>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item menu-link" data-menu="dashboard-b2b">
                Dashboard B2B
              </a>
            </li>

          </ul>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<div id="content-area"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// FORMAT 2 DESIMAL
function f2(v){
  const n = Number(v);
  if(isNaN(n)) return '-';
  return n.toFixed(2);
}

// DATA CONTOH (GANTI DARI API JUGA AMAN)
const districtBantenData = [
  {title:'Q Gangguan HSI', target:0.02, banten:2.884886, tangerang:2.494718},
  {title:'Asgar HSI', target:0.92, banten:95.047169, tangerang:90.579710},
  {title:'TTR DATIN K2', target:0.81, banten:100, tangerang:80},
  {title:'TTR DATIN K3', target:0.95, banten:100, tangerang:100},
  {title:'TTR INDIBIZ 4H', target:0.77, banten:55.555555, tangerang:91.666666},
  {title:'TTR INDIBIZ 24H', target:0.966, banten:98.684211, tangerang:97.752809},
  {title:'TTR RESELLER 6H', target:0.929, banten:80, tangerang:93.902439}
];

// RENDER DISTRICT BANTEN
function loadDistrictBanten(){
  let html = `<h4 class="text-center mb-4">Huddle Performance District BANTEN</h4>`;
  html += `<div class="cards-scroll">`;

  districtBantenData.forEach(d=>{
    html += `
    <div class="kpi-card">
      <div class="kpi-title">${d.title}</div>
      <div class="kpi-body">
        <div class="row-item target"><span>Target</span><span>${f2(d.target)}</span></div>
        <div class="row-item banten"><span>Banten</span><span>${f2(d.banten)}</span></div>
        <div class="row-item tangerang"><span>Tangerang</span><span>${f2(d.tangerang)}</span></div>
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('content-area').innerHTML = html;
}

// UNDER CONSTRUCTION
function loadUnder(){
  document.getElementById('content-area').innerHTML = `
    <div class="under">
      <img src="under_construction.png" alt="Under Construction">
    </div>`;
}

// MENU HANDLER
document.querySelectorAll('.menu-link').forEach(m=>{
  m.addEventListener('click',()=>{
    const menu = m.dataset.menu;
    if(menu === 'district-banten') loadDistrictBanten();
    else loadUnder();
  });
});
</script>

</body>
</html>
