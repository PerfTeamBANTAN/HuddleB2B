<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERFORMANCE BAN-TAN - Dashboard Integrated</title>

  <!-- Bootstrap & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-blue: #004085;
      --accent-blue: #007bff;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      overflow: hidden;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6) !important;
      box-shadow: none;
    }

    .navbar-brand {
      font-weight: bold;
      font-size: 24px;
      color: #fff;
    }

    .navbar-nav .nav-link {
      color: #fff !important;
      transition: 0.3s;
      padding: 8px 15px;
      border-radius: 6px;
    }

    .navbar-nav .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff !important;
    }

    .dropdown-menu {
      background-color: rgba(0, 0, 0, 0.85);
      border: none;
    }

    .dropdown-item {
      color: #fff;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Background awal fullscreen */
    .home-fullscreen {
      width: 100%;
      height: 100vh;
      background: url('huddle_performance.png') center center / cover no-repeat;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 56px; /* offset tinggi navbar */
      transition: background 0.3s ease;
    }

    /* class untuk menghapus background image */
    .no-bg {
      background: none !important;
      background-color: #000 !important;
    }

    /* Container konten */
    #content-area {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    #content-area img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    /* Kartu District BANTEN (dipakai di partial) */
    .badge-card {
      border: 2px solid #999;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      line-height: 1.2;
      background-color: #fffbe6;
      min-width: 170px;
      max-width: 190px;
      height: 80px;
      box-sizing: border-box;
    }

    .badge-card-header {
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #000;
      margin-bottom: 4px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-card .label {
      font-weight: 600;
    }

    .badge-card .value-target {
      color: #000;
    }

    .badge-card .value-banten {
      color: #0000aa;
    }

    .badge-card .value-tangerang {
      color: #cc0000;
    }

    .cards-scroll {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .cards-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .cards-scroll::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="javascript:void(0)" onclick="location.reload()">
      <img src="PERFORMANCE TEAM.png" style="height: 40px; margin-right: 10px;" alt="Logo">
      PERFORMANCE BAN-TAN
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <!-- Menu Rangking -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Huddle Performance
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item menu-link" data-menu="q-hsi">Q HSI</a></li>
            <li><a class="dropdown-item menu-link" data-menu="q-datin">Q DATIN</a></li>
          </ul>
        </li>

        <!-- Menu KPI -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Huddle Performance Khusus B2B
          </a>
          <ul class="dropdown-menu">
            <li class="dropdown dropend">
              <a class="dropdown-item dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                Dashboard B2B District BANTEN
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item menu-link" data-menu="District-Banten">District BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-banten">B2B BANTEN</a></li>
                <li><a class="dropdown-item menu-link" data-menu="b2b-tangerang">B2B TANGERANG</a></li>
              </ul>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item menu-link" data-menu="dashboard-b2b">Dashboard B2B</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Area konten utama -->
<div class="home-fullscreen" id="home-fullscreen">
  <div id="content-area">
    <!-- Awalnya kosong, hanya background huddle_performance -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // URL Web App Apps Script
  const B2B_API_URL =
    'https://script.google.com/macros/s/AKfycby8iFZkMY53F4pYQFuH00b6Av7NAwp5Rtrk3b1GfNd6hwJelmlSjcUGeZjXlnz_Zmr2/exec';

  function showUnderConstruction() {
    const home = document.getElementById('home-fullscreen');
    const contentArea = document.getElementById('content-area');

    home.classList.add('no-bg');

    contentArea.innerHTML = `
      <div class="d-flex flex-column align-items-center justify-content-center">
        <div class="spinner-border text-light mb-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div>Loading dashboard...</div>
      </div>
    `;

    setTimeout(function () {
      contentArea.innerHTML = '';
      const img = document.createElement('img');
      img.src = 'under contruction.png';
      img.alt = 'Under Construction';
      contentArea.appendChild(img);
    }, 1000);
  }

  // Helper untuk muat partial HTML ke #content-area
  async function loadPartialIntoContent(url, onLoaded) {
    const home = document.getElementById('home-fullscreen');
    const contentArea = document.getElementById('content-area');

    home.classList.add('no-bg');
    contentArea.innerHTML = `
      <div class="d-flex flex-column align-items-center justify-content-center">
        <div class="spinner-border text-light mb-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <div>Loading...</div>
      </div>
    `;

    try {
      const res = await fetch(url);
      const html = await res.text();
      contentArea.innerHTML = html;
      if (typeof onLoaded === 'function') onLoaded();
    } catch (e) {
      console.error(e);
      contentArea.innerHTML = '<div class="text-danger">Gagal memuat konten.</div>';
    }
  }

  // Binding menu-link
  document.querySelectorAll('.menu-link').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      const menu = this.dataset.menu;

      if (menu === 'District-Banten') {
        // muat partial + JS khusus District BANTEN
        loadPartialIntoContent('partials/district-banten.html', function () {
          const s = document.createElement('script');
          s.src = 'js/district-banten.js';
          s.onload = function () {
            if (typeof initDistrictBanten === 'function') {
              initDistrictBanten(B2B_API_URL);
            }
          };
          document.body.appendChild(s);
        });
      } else {
        // menu lain sementara masih under construction
        showUnderConstruction();
      }
    });
  });
</script>

</body>
</html>
