<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PERFORMANCE BAN-TAN - Dashboard Integrated</title>

<!-- ================= CSS ================= -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
}
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
}
.navbar-brand { font-weight: 700; font-size: 22px; color: #fff; }
.navbar-nav .nav-link { color: #fff !important; padding: 8px 14px; border-radius: 6px; }
.navbar-nav .nav-link:hover { background: rgba(255,255,255,0.15); }

.dropdown-menu { background: rgba(0,0,0,0.95); border: none; }
.dropdown-item { color: #fff; font-size: 14px; cursor: pointer; }
.dropdown-item:hover { background: rgba(255,255,255,0.1); }

.home-fullscreen {
  width: 100%;
  min-height: 100vh;
  margin-top: 56px;
  background: url('huddle_performance.png') center / cover no-repeat;
}
.no-bg { background: #000 !important; }

#content-area {
  width: 100%;
  min-height: calc(100vh - 56px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
#content-area.show-grid { display: block !important; }
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#" id="home-btn">
      <img src="PERFORMANCE TEAM.png" style="height:40px;margin-right:10px;" />
      PERFORMANCE BAN-TAN
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Huddle Performance</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item menu-link" data-menu="q-hsi">Q HSI</a></li>
            <li><a class="dropdown-item menu-link" data-menu="q-datin">Q DATIN</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Huddle Performance Khusus B2B
          </a>
          <ul class="dropdown-menu">
            <li class="dropdown dropend">
              <a class="dropdown-item dropdown-toggle" href="#" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                Dashboard B2B District BANTEN
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item menu-link" data-menu="District-Banten">Performance Q HSI</a></li>
                <li><a class="dropdown-item menu-link" data-menu="Asgar-HSI">Performance Assurance Guarantee HSI</a></li>
                <li><a class="dropdown-item menu-link" data-menu="TTR-HSI">Performance TTR HSI dan Datin</a></li>
              </ul>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item menu-link" data-menu="dashboard-b2b">Dashboard B2B</a></li>
          </ul>
        </li>

      </ul>
    </div>
  </div>
</nav>

<div class="home-fullscreen" id="home-fullscreen">
  <div id="content-area"></div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="modalTiketHI" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTiketHITitle">Detail Tiket HI</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-dark table-striped table-sm">
          <thead><tr id="tiket-hi-head"></tr></thead>
          <tbody id="tiket-hi-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ================= JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- CORE -->
<script src="js/core.js"></script>
<script src="js/tiket-hi-modal.js"></script>

<script>
/* ================= API CONFIG ================= */
setApiUrl(
  'https://script.google.com/macros/s/AKfycby8iFZkMY53F4pYQFuH00b6Av7NAwp5Rtrk3b1GfNd6hwJelmlSjcUGeZjXlnz_Zmr2/exec'
);

/* ================= UTIL ================= */
function showLoader(text='Loading...') {
  const home = document.getElementById('home-fullscreen');
  const content = document.getElementById('content-area');
  home.classList.add('no-bg');
  content.className = '';
  content.innerHTML = `
    <div class="text-center">
      <div class="spinner-border text-light mb-2"></div>
      <div>${text}</div>
    </div>`;
}

async function loadPartial(url, onLoaded) {
  showLoader('Loading dashboard...');
  const res = await fetch(url, { cache: 'no-store' });
  document.getElementById('content-area').innerHTML = await res.text();
  document.getElementById('content-area').classList.add('show-grid');
  onLoaded && onLoaded();
}

/* ================= MENU ================= */
document.querySelectorAll('.menu-link').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    const menu = el.dataset.menu;

    if (menu === 'District-Banten') {
      loadPartial('partials/district-banten.html', () => {
        const s = document.createElement('script');
        s.src = 'js/district-banten.js';
        s.onload = () => initDistrictBanten();
        document.body.appendChild(s);
      });
    }

    if (menu === 'Asgar-HSI') {
      loadPartial('partials/asgar-hsi.html', () => {
        const s = document.createElement('script');
        s.src = 'js/asgar-hsi.js';
        s.onload = () => initAsgarHSI();
        document.body.appendChild(s);
      });
    }
  });
});

document.getElementById('home-btn').onclick = e => {
  e.preventDefault();
  location.reload();
};
</script>

</body>
</html>
